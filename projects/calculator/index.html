 <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scientific Calculator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: #222;
        }
        .calculator {
            width: 320px;
            background: #333;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 0px 15px rgba(255, 255, 255, 0.1);
        }
        #display {
            width: 100%;
            height: 50px;
            font-size: 20px;
            text-align: right;
            padding: 10px;
            background: #444;
            color: white;
            border: none;
            outline: none;
        }
        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin-top: 10px;
        }
        button {
            padding: 15px;
            font-size: 18px;
            border: none;
            cursor: pointer;
            border-radius: 5px;
            background: #666;
            color: white;
        }
        button:hover {
            background: #888;
        }
        .equal {
            grid-column: span 2;
            background: orange;
        }
        .clear {
            background: red;
        }
    </style>
</head>
<body>

<div class="calculator">
    <input type="text" id="display" disabled>
    <div class="buttons">
        <button onclick="clearDisplay()" class="clear">C</button>
        <button onclick="appendToDisplay('(')">(</button>
        <button onclick="appendToDisplay(')')">)</button>
        <button onclick="backspace()">←</button>

        <button onclick="appendToDisplay('7')">7</button>
        <button onclick="appendToDisplay('8')">8</button>
        <button onclick="appendToDisplay('9')">9</button>
        <button onclick="appendToDisplay('/')">÷</button>

        <button onclick="appendToDisplay('4')">4</button>
        <button onclick="appendToDisplay('5')">5</button>
        <button onclick="appendToDisplay('6')">6</button>
        <button onclick="appendToDisplay('*')">×</button>

        <button onclick="appendToDisplay('1')">1</button>
        <button onclick="appendToDisplay('2')">2</button>
        <button onclick="appendToDisplay('3')">3</button>
        <button onclick="appendToDisplay('-')">−</button>

        <button onclick="appendToDisplay('0')">0</button>
        <button onclick="appendToDisplay('.')">.</button>
        <button onclick="calculateResult()" class="equal">=</button>
        <button onclick="appendToDisplay('+')">+</button>

        <button onclick="calculateSquareRoot()">√</button>
        <button onclick="calculatePower()">x²</button>
        <button onclick="calculateSin()">sin</button>
        <button onclick="calculateCos()">cos</button>
        <button onclick="calculateTan()">tan</button>
        <button onclick="calculateLog()">log</button>
    </div>
</div>

<script>
    let display = document.getElementById("display");

    function appendToDisplay(value) {
        display.value += value;
    }

    function clearDisplay() {
        display.value = "";
    }

    function backspace() {
        display.value = display.value.slice(0, -1);
    }

    function calculateResult() {
        try {
            let result = evaluateExpression(display.value);
            display.value = result;
        } catch (error) {
            display.value = "Error";
        }
    }

    function evaluateExpression(expression) {
        let tokens = expression.match(/(\d+\.\d+|\d+|[-+*/()])/g);
        if (!tokens) return 0;
        
        let stack = [];
        let operator = null;
        
        for (let token of tokens) {
            if (!isNaN(token)) {
                if (operator) {
                    let a = stack.pop();
                    let b = parseFloat(token);
                    stack.push(applyOperator(a, b, operator));
                    operator = null;
                } else {
                    stack.push(parseFloat(token));
                }
            } else {
                operator = token;
            }
        }
        
        return stack.length === 1 ? stack[0] : NaN;
    }

    function applyOperator(a, b, operator) {
        switch (operator) {
            case "+": return a + b;
            case "-": return a - b;
            case "*": return a * b;
            case "/": return b !== 0 ? a / b : "Error";
            default: return NaN;
        }
    }

    function calculateSquareRoot() {
        let value = parseFloat(display.value);
        display.value = value >= 0 ? Math.sqrt(value).toFixed(5) : "Error";
    }

    function calculatePower() {
        let value = parseFloat(display.value);
        display.value = Math.pow(value, 2).toFixed(5);
    }

    function calculateSin() {
        let value = parseFloat(display.value);
        display.value = Math.sin(value * Math.PI / 180).toFixed(5);
    }

    function calculateCos() {
        let value = parseFloat(display.value);
        display.value = Math.cos(value * Math.PI / 180).toFixed(5);
    }

    function calculateTan() {
        let value = parseFloat(display.value);
        display.value = Math.tan(value * Math.PI / 180).toFixed(5);
    }

    function calculateLog() {
        let value = parseFloat(display.value);
        display.value = value > 0 ? Math.log10(value).toFixed(5) : "Error";
    }
</script>

</body>
</html>
