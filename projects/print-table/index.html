<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Print Table</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            width: 100vw;
            height: 100vh;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #fbc2eb, #a6c1ee);
        }
        .container {
            text-align: center;
            background-color: #fff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            width: 300px;
        }
        h2 {
            margin-bottom: 20px;
            color: #333;
        }
        input {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 1rem;
        }
        button {
            width: 100%;
            padding: 10px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 1rem;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        button:hover {
            background-color: #45a049;
        }
        .output {
            margin-top: 20px;
            font-size: 1rem;
            color: #333;
        }
        li{
            list-style: none;
        }
        .home{
    cursor: pointer;
    width: 50%;
    margin-top: 30px;
    border-radius: 10px;
    border: none;
    color: white;
    font-weight: bold;
    font-size: 12px;
    font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
    padding: 10px 25px;
    background-color: red;
}
.home:hover{
    background-color: rgb(243, 84, 84);

}
    </style>
</head>
<body>
    <div class="container">
        <h2>Enter the number</h2>
        <input type="text" id="numberInput" placeholder="Enter a number" />
        <button id="printTable">Print Table</button>
        <a href="../index.html" > <button class="home">Back to Home</button> </a>
        <div class="output" id="tableOutput"></div>

    </div>

    <script>
        const numberInput = document.getElementById('numberInput');
        const printTableButton = document.getElementById('printTable');
        const tableOutput = document.getElementById('tableOutput');
function printTable(){
    const number = parseInt(numberInput.value);
            if (!isNaN(number)) {
                let tableHTML = `<p>Multiplication Table for ${number}:</p>`;
                tableHTML += '<ul>';
                for (let i = 1; i <= 10; i++) {
                    tableHTML += `<li>${number} x ${i} = ${number * i}</li>`;
                }
                tableHTML += '</ul>';
                tableOutput.innerHTML = tableHTML;
            } else {
                tableOutput.innerHTML = '<p>Please enter a valid number!</p>';
            }
}
        printTableButton.addEventListener('click', printTable);
        numberInput.addEventListener('keypress', (event) => {
            if (event.key === 'Enter') {
                printTable();
            }
        });
    </script>
</body>
</html>
