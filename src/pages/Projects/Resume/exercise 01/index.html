<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Checkbox</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100vw;
            height: 100vh;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #d9eb3b, #e47d07);
            color: #333;
        }
        .container {
            background: linear-gradient(135deg, #e47d07, #d9eb3b);

            padding: 2rem;
            width: 350px;
            height: 400px;
            border-radius: 20px;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
            text-align: center;
        }
        .checkbox-container {
            margin: 1rem 0;
        }
        input[type="checkbox"] {
            width: 20px;
            height: 20px;
            cursor: pointer;
            accent-color: #2193b0;
        }
        p {
            font-size: 1.2rem;
            margin-top: 1rem;
        }

        
 a {
    width: 60%;

}
  button{
    width: 100%;
    margin-top: 30px;
    border-radius: 10px;
    border: none;
    color: rgb(0, 0, 0);
    font-weight: bold;
    font-size: 18px;
    font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
    padding: 10px 25px;
    background-color: rgb(255, 235, 57);
}

@media screen and (max-width : 400px) {
    .container {

            width: 260px;
        }
}
    </style>
</head>
<body>
    <div class="container">
        <h1>Login Status</h1>
        <div class="checkbox-container">
            <label>
                <input type="checkbox" id="loginCheckbox">
                plesse login to see the data
            </label>
        </div>
        <p id="statusMessage">You are not logged in</p>
      
        <a href="../index.html" target="_blank">   <button id="additionalButton">See More Data</button> </a> 

    </div>

    <script>
        const loginCheckbox = document.getElementById('loginCheckbox');
        const statusMessage = document.getElementById('statusMessage');
        const additionalButton = document.getElementById('additionalButton');
        additionalButton.style.display = 'none';
        loginCheckbox.addEventListener('change', () => {
            if (loginCheckbox.checked) {
                statusMessage.textContent = 'You are logged in';
                additionalButton.style.display = 'inline-block';
            } else {
                statusMessage.textContent = 'You are not logged in';
                additionalButton.style.display = 'none';
            }
        });
    </script>
</body>
</html>
